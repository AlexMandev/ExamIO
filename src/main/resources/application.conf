examio {
  http {
    host="localhost"
    port=3000
  }

  db {
    host="localhost"
    port=5432
    name="examio"
    user="postgres"
    password="postgres"
    connectionPoolSize=10
    migrationTable="flyweight_migration_table"
  }

  jwt {
    secret="some-jwt-secret"
    expirationSeconds=86400
  }
}